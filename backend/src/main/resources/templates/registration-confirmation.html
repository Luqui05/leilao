<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Bem-vindo!</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        line-height: 1.6;
        color: #333;
      }
      .container {
        max-width: 600px;
        margin: 20px auto;
        padding: 20px;
        border: 1px solid #ddd;
        border-radius: 5px;
      }
      .header {
        font-size: 24px;
        font-weight: bold;
        margin-bottom: 20px;
        color: #28a745;
      }
      .button {
        display: inline-block;
        padding: 10px 20px;
        margin-top: 20px;
        background-color: #000000;
        color: #ffffff !important;
        text-decoration: none;
        border-radius: 5px;
      }
      .button:visited,
      .button:active,
      .button:hover {
        color: #ffffff !important;
        text-decoration: none;
      }
      .footer {
        margin-top: 20px;
        font-size: 12px;
        color: #777;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">Bem-vindo ao Leilão Online!</div>
      <p>Olá, <span th:text="${nome}">Nome do Usuário</span>!</p>
      <p>
        Sua conta foi criada com sucesso. Estamos felizes em ter você conosco.
      </p>
      <p>
        Agora você pode participar de leilões, dar lances e muito mais. Para
        começar, acesse o sistema pelo botão abaixo.
      </p>

      <a th:href="${linkLogin}" class="button">Acessar o Sistema</a>

      <p class="footer">Atenciosamente,<br />Equipe Leilão Online</p>
    </div>
  </body>
</html>
